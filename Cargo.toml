[package]
name = "reseller"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "Self-hosted OpenAI-compatible API reseller: streaming proxy, images, metering, card and crypto billing, white-label dashboards"
license = "MIT"
repository = "https://github.com/reseller-rs/reseller"
readme = "README.md"
keywords = ["openai", "proxy", "billing", "llm", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]
include = ["src/**", "assets/**", "migrations/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "form", "stream"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
