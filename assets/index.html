<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0e0d">
  <meta name="description" content="Your API workspace. Create keys, track usage, and manage your balance.">
  <title>Reseller — API workspace</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="shell">
      <a class="brand" href="/"><img class="mark" src="/assets/favicon.svg" alt="" width="36" height="36"> reseller</a>
      <div class="actions" id="header-actions"></div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div class="loading"><span class="spinner" aria-hidden="true"></span>Loading your workspace…</div>
    <noscript><div class="card error">This workspace needs JavaScript. API endpoints remain available at <code>/v1</code>.</div></noscript>
  </main>
  <div id="notice" popover="manual" role="status" aria-live="polite" aria-atomic="true"></div>
  <footer>
    <div class="shell">
      <span>Reseller <span class="muted">/ independently hosted</span></span>
      <a href="https://github.com/reseller-rs/reseller">Source ↗</a>
    </div>
  </footer>
</body>
</html>
