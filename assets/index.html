<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{color_scheme}}">
  <meta name="theme-color" content="{{theme_color}}">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  {{favicon_links}}
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <script type="application/json" id="branding">{{branding_json}}</script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="shell">
      <a class="brand" href="/"><img class="mark" src="{{logo_url}}" alt="" width="36" height="36"> <span class="brand-name">{{name}}</span></a>
      <div class="actions" id="header-actions"></div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div class="loading"><span class="spinner" aria-hidden="true"></span>Loading your workspace…</div>
    <noscript><div class="card error">This workspace needs JavaScript. API endpoints remain available at <code>/v1</code>.</div></noscript>
  </main>
  <div id="notice" popover="manual" role="status" aria-live="polite" aria-atomic="true"></div>
  <footer>
    <div class="shell">
      <span>{{name}} <span class="muted">{{footer_text}}</span></span>
      <span class="footer-links">{{footer_links}}</span>
    </div>
  </footer>
</body>
</html>
