<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{color_scheme}}">
  <meta name="theme-color" content="{{theme_color}}">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  {{favicon_links}}
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <script type="application/json" id="branding">{{branding_json}}</script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="shell">
      <a class="brand" href="/"><img class="mark" src="{{logo_url}}" alt="" width="36" height="36"> <span class="brand-name">{{name}}</span></a>
      <div class="actions" id="header-actions"></div>
    </div>
  </header>
  <main id="main" tabindex="-1" aria-busy="true">
    <!-- Neutral placeholder until the app paints a route-shaped one -->
    <div class="skeleton" role="status"><span class="sr-only">Loading...</span><div class="skeleton-body" aria-hidden="true">
      <div class="page-head"><div><span class="skel skel-title"></span><span class="skel skel-line md"></span></div></div>
      <div class="stats">
        <div class="card metric-card"><span class="skel skel-line sm"></span><span class="skel skel-metric"></span><span class="skel skel-line md"></span></div>
        <div class="card metric-card"><span class="skel skel-line sm"></span><span class="skel skel-metric"></span><span class="skel skel-line md"></span></div>
        <div class="card metric-card"><span class="skel skel-line sm"></span><span class="skel skel-metric"></span><span class="skel skel-line md"></span></div>
        <div class="card metric-card"><span class="skel skel-line sm"></span><span class="skel skel-metric"></span><span class="skel skel-line md"></span></div>
      </div>
      <div class="skel-table">
        <div class="skel-row head"><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span></div>
        <div class="skel-row"><span class="skel skel-line md"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span></div>
        <div class="skel-row"><span class="skel skel-line md"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span></div>
        <div class="skel-row"><span class="skel skel-line md"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span><span class="skel skel-line sm"></span></div>
      </div>
    </div></div>
    <noscript><div class="card error">This workspace needs JavaScript. API endpoints remain available at <code>/v1</code>.</div></noscript>
  </main>
  <div id="notice" popover="manual" role="status" aria-live="polite" aria-atomic="true"></div>
  <footer>
    <div class="shell">
      <span>{{name}} <span class="muted">{{footer_text}}</span></span>
      <span class="footer-links"><span class="footer-legal" id="footer-legal"><a href="/terms">Terms</a><a href="/privacy">Privacy</a></span>{{footer_links}}</span>
    </div>
  </footer>
</body>
</html>
