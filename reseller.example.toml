# =============================================================================
#  reseller — starter configuration
# =============================================================================
#
#  HOW THIS FILE IS USED
#  ---------------------
#  This file seeds the SQLite database on the first start only. Afterwards the
#  database is authoritative: change settings in Admin -> Settings (or with the
#  API), not here. `reseller init` never overwrites an existing file.
#
#  WHAT TO EDIT
#  ------------
#  Set [llm].api_key (and base_url/model if you do not use OpenAI). Everything
#  else has a working default and is commented out; remove the leading "#" to
#  activate a setting. Uncommenting a table header such as [tts] activates the
#  whole block, so uncomment its keys too.
#
#  BOOTSTRAP ENVIRONMENT VARIABLES (first start only)
#  --------------------------------------------------
#  OPENAI_BASE_URL OPENAI_API_KEY OPENAI_MODEL OPENAI_MODEL_FALLBACKS
#  TTS_BASE_URL TTS_API_KEY TTS_MODEL TTS_MODEL_FALLBACKS TTS_VOICE
#  STT_BASE_URL STT_API_KEY STT_MODEL STT_MODEL_FALLBACKS
#  IMG_BASE_URL IMG_API_KEY IMG_MODEL IMG_MODEL_FALLBACKS
#  ADMIN_TOKEN KEY_PEPPER MARKUP_PCT FREE_CREDIT_USD PUBLIC_URL BRAND_NAME
#  STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
#  PAYROOF_API_URL PAYROOF_PROJECT PAYROOF_TOKEN PAYROOF_WEBHOOK_SECRET
#
#  Always-runtime environment variables (also available as CLI flags):
#  HOST PORT DB_FILE RESELLER_CONFIG RESELLER_THEME_DIR RUST_LOG.
#
#  To replace the stored settings later, stop the server and run
#  `reseller config import <file>`; `reseller config export` prints them.
#
#  FORMATS
#  -------
#  Money and percentages are decimal STRINGS: markup_pct = "30",
#  max_usd = "5", input = "0.5". Negative values, NaN and Infinity are
#  rejected. Byte sizes and durations are integers; expiry inputs accept Unix
#  seconds or RFC3339 timestamps. Booleans are true/false.
#
#  SECURITY
#  --------
#  This file and the database hold credentials. Keep both private (`reseller
#  init` writes mode 0600) and protect database backups.
# =============================================================================

# Externally reachable origin. Used for dashboard links, API hints, payment
# redirects, and webhook URLs. Must be an absolute http(s) URL without query or
# fragment.
public_url = "http://localhost:56787"

# --- credentials -------------------------------------------------------------
# Administrator token for /admin. Leave empty (or commented) to have a
# secure token generated and printed on first start. Minimum 24 characters.
# admin_token = ""

# HMAC pepper used to hash API keys, dashboard tokens, and redeem codes. Leave
# empty (or commented) to generate one on first start. Minimum 24 characters.
# WARNING: changing this invalidates every customer credential and every
# unredeemed code.
# key_pepper = ""

# --- request rewriting policies ----------------------------------------------
# How the model field is handled for llm requests (and voice for tts). The
# multipart model field on uploads (for example STT) follows the same policy
# while the audio payload streams through untouched.
# Options:
#   "default"     fill it from the upstream config only when the client omits it
#   "force"       always overwrite whatever the client sent
#   "passthrough" never modify the client's value
# model_policy = "default"
# voice_policy = "default"

# --- billing -----------------------------------------------------------------
# Markup over upstream cost, as a percentage decimal string. Resolution order
# is key -> account -> this global default. "0" bills at upstream cost.
# markup_pct = "30"

# --- access control ----------------------------------------------------------
# Require a valid API key on proxy routes. When false, requests without
# credentials are served anonymously and are not billed.
# require_key = true

# Only meaningful with require_key = false: treat any non-empty token as an
# anonymous request instead of rejecting unknown credentials.
# accept_any_token = false

# Trust CF-Connecting-IP, else the last X-Forwarded-For entry, for client IPs,
# key allowances, and request logs. Enable only when the app is reachable
# exclusively through a proxy that sets those headers.
# trust_proxy = false

# CORS for browser clients: "" disables CORS, "*" allows any origin, and any
# other value is used verbatim (for example "https://app.example.com").
# Changes require a restart.
# cors_origin = ""

# --- HTTP, timeouts, retention ----------------------------------------------
# Request body limits in bytes. Defaults: 50 MiB JSON, 512 MiB streamed
# uploads. Maximums: 512 MiB JSON, 2 GiB streamed uploads.
# max_json_body_bytes = 52428800
# max_stream_body_bytes = 536870912

# Upstream connect/stream timeout in seconds (must be greater than 0).
# upstream_timeout_seconds = 300

# Delete finished request logs older than this many days while keeping at most
# max_log_entries rows. Both values must be greater than 0.
# log_retention_days = 30
# max_log_entries = 5000

# =============================================================================
#  SIGNUP (anonymous self-service accounts)
#  Setting a guard to 0 disables it.
# =============================================================================

# [signup]
# enabled = true
# free_credit_usd = "0.25"       # trial credit; "0" for none
# free_credit_expiry_days = 30   # 0 = never expires
# ip_limit_per_month = 2         # new keys per source IP per calendar month
# cooldown_seconds = 30          # minimum wait between creations from one IP
# global_hourly_limit = 100      # key creations per hour (signup, child keys, rotations)
# pow_max_number = 100000        # proof-of-work difficulty (ALTCHA); 0 disables it
# pow_ttl_seconds = 300          # how long a challenge stays solvable
# [signup.ip_overrides]          # per-IP replacement for ip_limit_per_month
# "203.0.113.7" = 10
# "198.51.100.9" = 0             # unlimited

# =============================================================================
#  KEY POLICY
#  default_limits are copied onto every newly minted key; existing keys keep
#  the limits they were created with. Window hours must be 1-8760.
# =============================================================================

# [keys]
# max_per_account = 10           # active keys per account (greater than 0)
# max_new_per_day = 20           # keys a customer creates or rotates per rolling 24h
# rotate_cooldown_seconds = 300  # customers may rotate keys only this old or older
#
# [keys.default_limits]
# rpm = 60
# requests = { max = 2000, window_hours = 24 }
# tokens = { max = 1000000, window_hours = 720 }
# spend = { max_usd = "5", window_hours = 720 }
# max_children = 2
# allowed_models = []

# =============================================================================
#  RATE LIMITS (0 disables each)
# =============================================================================

# [rate_limits]
# management_per_minute = 120      # per client IP: signup, keys, account, plans, admin API
# auth_failures_per_hour = 20      # per client IP; then credentialed requests get 429
# max_concurrent_requests = 8      # per account, in-flight proxy requests
# checkouts_per_hour = 10          # per account
# redeem_failures_per_hour = 10    # per account
# challenges_per_minute = 10       # per client IP, signup challenges

# =============================================================================
#  MCP (Model Context Protocol)
# =============================================================================

# [mcp]
# enabled = true
# max_media_bytes = 16777216       # largest audio/image returned inline by tools

# =============================================================================
#  UPSTREAMS
#  Each upstream is configured independently. base_url must be an http(s) URL
#  without credentials, query, or fragment. fallbacks are ordered model names
#  tried after availability errors (400/402/404/408/429/5xx) for JSON requests;
#  at most 10, and each fallback must also pass the key's allowed_models list.
# =============================================================================

# Language models. Required for /v1/chat/completions and other JSON routes.
[llm]
base_url = "https://api.openai.com/v1"
api_key = "sk-replace-with-your-upstream-key"
# Model sent when the client omits one, and always with model_policy = "force".
# Leave the string empty to require clients to choose a model.
model = "gpt-4o-mini"
# Ordered fallback models, for example ["gpt-4o", "gpt-4o-mini"].
# fallbacks = []
# Per-upstream timeout in seconds (0 = upstream_timeout_seconds, max 3600).
# timeout_seconds = 0
# Extra request headers for this upstream (Authorization, Host and framing
# headers cannot be set). Every upstream section accepts these two keys.
# headers = { "HTTP-Referer" = "https://api.example.com", "X-Title" = "My API" }

# Text-to-speech. Required only for /v1/audio/speech.
# [tts]
# base_url = "https://api.openai.com/v1"
# api_key = "sk-replace-with-your-upstream-key"
# model = "gpt-4o-mini-tts"
# Voice sent when the client omits one, and always with voice_policy = "force".
# voice = ""
# fallbacks = []

# Speech-to-text. Required only for /v1/audio/transcriptions and
# /v1/audio/translations. With model_policy = "force" (or "default" plus a
# configured model), the multipart model field is rewritten to this value.
# [stt]
# base_url = "https://api.openai.com/v1"
# api_key = "sk-replace-with-your-upstream-key"
# model = "whisper-1"
# fallbacks = []

# Image generation and editing. Required only for /v1/images,
# /v1/images/generations, /v1/images/edits and /v1/images/variations. JSON
# requests follow model_policy (reference images travel inline, for example
# "input_references": [{"type":"image_url","image_url":{"url":"data:…"}}]);
# multipart edits stream like other uploads.
# [image]
# base_url = "https://openrouter.ai/api/v1"
# api_key = "sk-or-replace-with-your-upstream-key"
# model = "meta/muse-image"
# fallbacks = []

# =============================================================================
#  PRICE TABLE
#  The "default" entry covers models without their own section; model names
#  match case-insensitively. All values are USD decimal strings:
#    input / output   per 1,000,000 input / output tokens
#    cached_input     per 1,000,000 cached input tokens (absent = input price)
#    audio_second     per second of audio (STT JSON usage, WAV/PCM TTS output)
#    characters       per 1,000,000 input characters (TTS, e.g. "15" for tts-1)
#    image            per generated image
#    request          flat fee per successful (2xx) request
#  Upstream cost of a request:
#    usage = provider usage.cost when reported (an explicit 0 counts), else
#            (input-cached)*input + cached*cached_input + output*output
#            + characters*characters (all /1e6) + seconds*audio_second
#            + images*image
#    upstream = usage + request (2xx only); billed = upstream * (1 + markup/100)
#  Each value is rounded once to whole micro-USD (half away from zero); a
#  positive cost never rounds down to zero. LLM responses without any usage
#  report are estimated at ~4 characters per token and flagged "estimated".
# =============================================================================

# [prices.default]
# input = "0.5"
# cached_input = "0.25"
# output = "1.5"
# audio_second = "0"
# characters = "0"
# image = "0"
# request = "0"

# Per-model override example. Quote model names containing dots, slashes, or
# colons.
# [prices."meta/muse-image"]
# input = "0"
# output = "0"
# audio_second = "0"
# characters = "0"
# image = "0.01"
# request = "0"

# =============================================================================
#  BRANDING (white label)
#  Names, copy, logo, favicon, colours and CSS of the web app. Logos and
#  favicons are site paths (for example files in the theme directory, served
#  at /theme/<file>) or http(s) URLs. css_vars override the built-in CSS
#  custom properties (accent, accent-2, accent-ink, bg, panel, text, muted,
#  border, radius, …) without the leading "--". With --theme-dir, a
#  theme.css file is appended to the stylesheet and an index.html file
#  replaces the page template ({{name}}, {{title}}, {{logo_url}}, …).
# =============================================================================

# [branding]
# name = "Reseller"
# tagline = "API workspace"
# description = "Your API workspace. Create keys, track usage, and manage your balance."
# logo_url = ""            # e.g. "/theme/logo.svg"; empty = built-in mark
# favicon_url = ""         # e.g. "/theme/favicon.png"; empty = built-in icon
# theme_color = "#0c0e0d"
# color_scheme = "dark"    # "dark" or "light"
# custom_css = ""
# hero_eyebrow = ""        # landing page copy; empty keeps the built-in text
# hero_title = ""
# hero_text = ""
# footer_text = "independently hosted"
# footer_links = [{ label = "Source ↗", url = "https://github.com/reseller-rs/reseller" }]
#
# [branding.css_vars]
# accent = "#ff7a1a"
# accent-2 = "#ff9f4a"
# accent-ink = "#1d0d00"

# =============================================================================
#  PAYMENTS (optional)
# =============================================================================

# Stripe Checkout (cards). Set both values, then register
# {public_url}/webhooks/stripe for checkout.session.completed and
# checkout.session.async_payment_succeeded.
# [stripe]
# secret_key = ""
# webhook_secret = ""

# Payroof crypto payments: USDC/USDT and native coins (ETH, POL, BNB, …) on
# the EVM chains your Payroof project watches. Set project and token (a prf_
# project token with the "references" and "webhooks" permissions), then use
# Admin -> Payments -> "Register webhook" (requires an https public_url) or
# paste the whsec_ secret of a webhook pointing at {public_url}/webhooks/payroof.
# [payroof]
# api_url = "https://api.payroof.top"
# project = ""
# token = ""
# webhook_secret = ""
# stablecoins = ["USDC", "USDT"]   # valued 1:1 with USD
# native_coins = true              # quote native coins at the current rate
# chains = []                      # CAIP-2 ids to offer; empty = all watched
# rate_source = "coingecko"        # or "static" (native_rates_usd only)
# rate_url = "https://api.coingecko.com/api/v3/simple/price"
# quote_ttl_minutes = 60           # quotes and native rates hold this long
# underpayment_tolerance_pct = "0.5"
# native_rates_usd = { ETH = "3000" }   # fixed rates override the feed
# [payroof.rate_ids]               # native symbol -> CoinGecko coin id
# ETH = "ethereum"
# POL = "polygon-ecosystem-token"
# BNB = "binancecoin"
