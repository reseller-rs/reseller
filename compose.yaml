# Single-service deployment. Set the values below in an .env file or the shell.
services:
  reseller:
    # Image published by the release workflow.
    image: ghcr.io/reseller-rs/reseller:latest
    restart: unless-stopped
    # Publish the HTTP port on every host interface.
    ports:
      - "56787:56787"
    # Bootstrap values. They seed the settings only on the first start, and
    # later changes to them have no effect (edit Admin > Settings instead).
    #
    # The starter settings file (reseller.example.toml, mounted below) lists
    # the providers, a balanced free model, and a paid model, and reads the
    # provider keys from the variables in the first block. Providers whose key
    # is unset stay disabled. Each OPENAI_, TTS_, STT_, and IMG_ group also
    # creates one provider and one paid model, with *_MODEL_FALLBACKS as extra
    # routes.
    environment:
      RESELLER_CONFIG: /config/reseller.toml
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER2_API_KEY: ${OPENROUTER2_API_KEY:-}
      OPENROUTER2_MODEL: ${OPENROUTER2_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AUTH_TOKEN: ${CLOUDFLARE_AUTH_TOKEN:-}
      CLOUDFLARE_MODEL: ${CLOUDFLARE_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-https://api.openai.com/v1}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      STT_BASE_URL: ${STT_BASE_URL:-https://api.openai.com/v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      IMG_BASE_URL: ${IMG_BASE_URL:-https://api.openai.com/v1}
      IMG_API_KEY: ${IMG_API_KEY:-}
      IMG_MODEL: ${IMG_MODEL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:56787}
      BRAND_NAME: ${BRAND_NAME:-Reseller}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYROOF_PROJECT: ${PAYROOF_PROJECT:-}
      PAYROOF_TOKEN: ${PAYROOF_TOKEN:-}
      PAYROOF_WEBHOOK_SECRET: ${PAYROOF_WEBHOOK_SECRET:-}
      # Native app purchases (App Store, Google Play). See README > Payments.
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      GOOGLE_PACKAGE_NAME: ${GOOGLE_PACKAGE_NAME:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_PUBSUB_SERVICE_ACCOUNT: ${GOOGLE_PUBSUB_SERVICE_ACCOUNT:-}
      # White-label files (logo, favicon, theme.css, index.html). See README.
      # RESELLER_THEME_DIR: /theme
    # Named volume for the SQLite database and generated files.
    volumes:
      - reseller-data:/data
      # Settings file read on the first start. Copy it to reseller.toml to
      # customize it, and mount that file instead.
      - ./reseller.example.toml:/config/reseller.toml:ro
      # - ./theme:/theme:ro
    # Time Docker waits for a graceful shutdown before it kills the container.
    stop_grace_period: 330s
    # Hardening: block privilege escalation and drop all Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  reseller-data:
